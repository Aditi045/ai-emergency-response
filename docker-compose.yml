version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: resqintel-postgres
    restart: always
    environment:
      POSTGRES_USER: resqintel
      POSTGRES_PASSWORD: resqintel_password
      POSTGRES_DB: resqintel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqintel -d resqintel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resqintel-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resqintel-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://resqintel:resqintel_password@postgres:5432/resqintel_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=resqintel-super-secure-production-jwt-secret-key-vit-2026
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage

  frontend:
    image: node:20-alpine
    container_name: resqintel-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
